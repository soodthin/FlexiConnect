server.port=${PORT:8081}
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flexiconnectdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#==========================================================
# HikariCP Connection Pool
# Pool tối đa 3 connections (DEV plan chỉ cho 5)
spring.datasource.hikari.maximum-pool-size=3
# Luôn giữ ít nhất 1 connection mở sẵn
spring.datasource.hikari.minimum-idle=1
# Đóng connection rảnh nếu idle > 10s
spring.datasource.hikari.idle-timeout=10000
# Thời gian chờ lấy connection nếu pool full (30s)
spring.datasource.hikari.connection-timeout=30000
# Tu\u1ed5i th\u1ecd t\u1ed1i \u0111a c\u1ee7a 1 connection (60s) r\u1ed3i refresh tr\u00e1nh l\u1ed7i stale
spring.datasource.hikari.max-lifetime=60000

