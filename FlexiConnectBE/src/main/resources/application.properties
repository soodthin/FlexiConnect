#==========================================================
# HikariCP Connection Pool
# Pool t\u1ed1i \u0111a 3 connections (DEV plan ch\u1ec9 cho 5)
spring.datasource.hikari.maximum-pool-size=3
# Lu\u00f4n gi\u1eef \u00edt nh\u1ea5t 1 connection m\u1edf s\u1eb5n
spring.datasource.hikari.minimum-idle=1
# \u0110\u00f3ng connection r\u1ea3nh n\u1ebfu idle > 10s
spring.datasource.hikari.idle-timeout=10000
# Th\u1eddi gian ch\u1edd l\u1ea5y connection n\u1ebfu pool full (20s)
spring.datasource.hikari.connection-timeout=20000
# Tu\u1ed5i th\u1ecd t\u1ed1i \u0111a c\u1ee7a 1 connection (60s) r\u1ed3i refresh tr\u00e1nh l\u1ed7i stale
spring.datasource.hikari.max-lifetime=60000

#==========================================================
# Database Clever Cloud
spring.datasource.url=jdbc:mysql://${MYSQL_ADDON_HOST}:${MYSQL_ADDON_PORT}/${MYSQL_ADDON_DB}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_ADDON_USER}
spring.datasource.password=${MYSQL_ADDON_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework=DEBUG

#==========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

#==========================================================
ai.n8n.webhook-url=${N8N_WEBHOOK_URL}
ai.n8n.analysis-url=${N8N_ANALYSIS_URL}
ai.n8n.generate-url=${N8N_GENERATE_URL}


